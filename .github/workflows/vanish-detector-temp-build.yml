name: Build Vanish Detector

on:
  push:
    branches:
      - chatgpt/vanish-detector-build-1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Decode and repair source archive
        run: |
          mkdir -p work
          cat vanish-detector-build/source.part.* > work/source.b64
          base64 -d work/source.b64 > work/source.zip
          zip -FF work/source.zip --out work/repaired.zip >/tmp/zip-repair.log 2>&1 || true
          cat /tmp/zip-repair.log
          cd work
          unzip -q repaired.zip
      - name: Bootstrap Gradle wrapper
        run: |
          cd work/vanish_detector_addon
          curl -L https://services.gradle.org/distributions/gradle-9.8.1-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          /tmp/gradle-9.8.1/bin/gradle wrapper --gradle-version 9.8.1
      - name: Build
        run: |
          cd work/vanish_detector_addon
          ./gradlew build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: meteor-vanish-detector-1.0.0
          path: work/vanish_detector_addon/build/libs/*.jar
