name: Build Vanish Detector

on:
  push:
    branches:
      - chatgpt/vanish-detector-build-1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.8.1'
      - name: Decode and repair source archive
        run: |
          mkdir -p work
          cat vanish-detector-build/source.part.* > work/source.b64
          base64 -d work/source.b64 > work/source.zip
          zip -FF work/source.zip --out work/repaired.zip >/tmp/zip-repair.log 2>&1 || true
          cat /tmp/zip-repair.log
          cd work
          unzip -q repaired.zip
      - name: Patch Minecraft 26.3 record accessors
        run: |
          FILE=work/vanish_detector_addon/src/main/java/com/calminlabs/vanishdetector/modules/VanishDetector.java
          sed -i 's/packet\.getEntityIds()/packet.entityIds()/g' "$FILE"
          sed -i 's/p\.getDisplayName()/p.displayName()/g' "$FILE"
          sed -i 's/p\.getPlayerPrefix()/p.playerPrefix()/g' "$FILE"
          sed -i 's/p\.getPlayerSuffix()/p.playerSuffix()/g' "$FILE"
          sed -i 's/packet\.getParticle()/packet.particle()/g' "$FILE"
          sed -i 's/packet\.getX()/packet.x()/g' "$FILE"
          sed -i 's/packet\.getY()/packet.y()/g' "$FILE"
          sed -i 's/packet\.getZ()/packet.z()/g' "$FILE"
      - name: Build
        run: |
          cd work/vanish_detector_addon
          gradle build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: meteor-vanish-detector-1.0.0
          path: work/vanish_detector_addon/build/libs/*.jar
